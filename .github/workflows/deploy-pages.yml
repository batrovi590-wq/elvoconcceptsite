name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'project site/src/**'
      - 'project site/public/**'
      - 'project site/index.html'
      - 'project site/vite.config.ts'
      - 'project site/package.json'
      - 'project site/package-lock.json'
      - 'project site/scripts/prepare-pages.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'project site/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: 'project site'
      - name: Build site
        run: npm run build
        working-directory: 'project site'
      - name: Prepare static site
        run: node 'project site/scripts/prepare-pages.mjs'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'project site/.pages-site'
      - id: deployment
        uses: actions/deploy-pages@v4